<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xabarlar — Admin — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<!-- Chat qobig'i stillari: css/widgets.css (talaba va instruktor sahifalari
     bilan umumiy — `.chat-shell`, admin uchun `.theme-admin` urg'usi) -->
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="admin" data-active="admin-messages">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <nav class="breadcrumb-demo" aria-label="Breadcrumb"><span data-i18n="bc.admin">Admin</span><span class="sep">/</span><span class="current" data-i18n="chat.title">Xabarlar</span></nav>
      <div class="topbar-actions">
        <a href="../shared/notifications.html" class="icon-btn" aria-label="Bildirishnomalar"><i class="bi bi-bell-fill"></i><span class="dot"></span></a>
        <div class="avatar avatar-admin">AD</div>
      </div>
    </header>

    <!-- QO'LLAB-QUVVATLASH QUTISI
         Talaba va instruktor sahifalaridagi bilan AYNI qobiq va AYNI
         js/chat.js — farqi `.theme-admin` urg'usi va tab'lar ro'yxati.
         "Guruhlar" tab'i yo'q: admin kurs oqimlarining a'zosi emas, ya'ni
         u tab doim bo'sh turardi.

         Bu sahifa "Isloh Support" suhbatlarining ikkinchi tomoni. Ilgari
         talaba chatida support suhbatdosh sifatida bor edi, lekin unga
         javob beradigan ekran umuman mavjud emasdi. -->
    <div class="chat-shell theme-admin">
      <!-- SUHBATLAR RO'YXATI -->
      <div class="chat-list-col">
        <div class="chat-list-head">
          <h3 data-i18n="chat.title">Xabarlar</h3>
          <button class="btn btn-primary btn-sm" data-new-chat><i class="bi bi-plus-lg"></i> <span data-i18n="chat.new">Yangi chat</span></button>
        </div>
        <div class="chat-tabs" role="tablist" aria-label="Suhbat turlari">
          <button type="button" class="chat-tab active" role="tab" aria-selected="true" data-chat-tab="all" data-i18n="chat.tab.all">Suhbatlar</button>
          <button type="button" class="chat-tab" role="tab" aria-selected="false" tabindex="-1" data-chat-tab="archive" data-i18n="chat.tab.archive">Arxiv</button>
        </div>
        <div class="chat-search"><i class="bi bi-search"></i><input type="text" id="chat-search-input" placeholder="Suhbat yoki foydalanuvchi qidirish..." data-i18n-placeholder="chat.search.ph" aria-label="Suhbat yoki foydalanuvchi qidirish..." data-i18n-aria-label="chat.search.ph"></div>

        <div class="chat-scroll" data-chat-list></div>
        <div class="empty-state chat-list-empty" data-chat-list-empty hidden>
          <div class="empty-icon"><i class="bi bi-chat-dots"></i></div>
          <div class="empty-title" data-i18n="chat.empty.list.title">Suhbat topilmadi</div>
          <div class="empty-sub" data-i18n="chat.empty.list.sub">"Yangi chat" orqali email bilan boshlang.</div>
        </div>
      </div>

      <!-- SUHBAT -->
      <div class="chat-thread">
        <div class="chat-thread-empty" data-chat-empty-state>
          <div class="empty-state">
            <div class="empty-icon"><i class="bi bi-chat-square-text"></i></div>
            <div class="empty-title" data-i18n="chat.empty.thread.title">Suhbatni tanlang</div>
            <div class="empty-sub" data-i18n="chat.empty.thread.sub">Chapdagi ro'yxatdan birini tanlang yoki "Yangi chat" orqali boshlang.</div>
          </div>
        </div>

        <div class="chat-thread-pane" data-chat-active-thread hidden>
          <div class="thread-head">
            <div class="thread-head-main">
              <button type="button" class="icon-btn chat-back" data-chat-back aria-label="Suhbatlar ro'yxatiga qaytish" data-i18n-aria-label="chat.back"><i class="bi bi-arrow-left"></i></button>
              <div class="presence-wrap"><div class="avatar" data-thread-avatar></div><span class="presence-dot" data-thread-presence hidden></span></div>
              <div class="info">
                <div class="name" data-thread-name></div>
                <div class="sub" data-thread-status></div>
              </div>
            </div>
            <div class="thread-actions">
              <div class="dropdown">
                <button type="button" class="icon-btn dropdown-trigger" aria-haspopup="true" aria-expanded="false" aria-label="Suhbat amallari" data-i18n-aria-label="chat.actions"><i class="bi bi-three-dots"></i></button>
                <div class="dropdown-menu dropdown-menu-right" role="menu">
                  <button type="button" class="dropdown-item" role="menuitem" data-thread-mute><i class="bi bi-bell-slash"></i> <span data-thread-mute-label>Ovozni o'chirish</span></button>
                  <button type="button" class="dropdown-item" role="menuitem" data-thread-archive><i class="bi bi-archive"></i> <span data-thread-archive-label>Arxivlash</span></button>
                </div>
              </div>
            </div>
          </div>

          <div class="pin-banner" data-thread-pin hidden><i class="bi bi-pin-angle-fill"></i> <span data-thread-pin-text></span></div>

          <div class="thread-body" data-thread-body role="log" aria-live="polite"></div>

          <div class="thread-input" data-backend-pending-reason="fayl saqlash uchun server talab qiladi">
            <button class="icon-btn" data-backend-pending="Fayl biriktirish" aria-label="Fayl biriktirish" data-i18n-aria-label="chat.attach"><i class="bi bi-paperclip"></i></button>
            <input type="text" id="chat-message-input" placeholder="Xabar yozing..." data-i18n-placeholder="chat.input.ph" aria-label="Xabar yozing..." data-i18n-aria-label="chat.input.ph">
            <button class="send-btn" data-chat-send aria-label="Yuborish" data-i18n-aria-label="chat.send"><i class="bi bi-send-fill"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="new-chat-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 class="chat-modal-title" data-i18n="chat.modal.new.title">Yangi chat boshlash</h3>
      <button class="icon-btn" data-modal-close aria-label="Yopish" data-i18n-aria-label="ui.close"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="email" id="new-chat-email" class="chat-email-input" placeholder="Foydalanuvchi email manzilini kiriting..." data-i18n-placeholder="chat.modal.new.ph">
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-modal-close data-i18n="ui.cancel">Bekor qilish</button>
      <button class="btn btn-primary" data-new-chat-submit><i class="bi bi-chat-dots"></i> <span data-i18n="chat.modal.new.submit">Boshlash</span></button>
    </div>
  </div>
</div>

<script src="../../js/api.js"></script>
<script src="../../js/ui-feedback.js"></script>
<script src="../../js/auth-guard.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/profile.js"></script>
<script src="../../js/dropdown.js"></script>
<script src="../../js/user-menu.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/modal.js"></script>
<!-- chat-store.js chat.js dan oldin: ko'rinish do'kondagi funksiyalarni chaqiradi -->
<!-- Fayl biriktirish tugmasini o'chirib qo'yadi va sababini aytadi -->
<script src="../../js/backend-pending.js"></script>
<script src="../../js/chat-store.js"></script>
<script src="../../js/chat.js"></script>
</body>
</html>
