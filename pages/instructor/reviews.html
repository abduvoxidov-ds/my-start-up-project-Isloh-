<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharhlar — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="instructor" data-active="reviews">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <nav class="breadcrumb-demo" aria-label="Breadcrumb"><span>Instructor</span><span class="sep">/</span><span class="current">Sharhlar</span></nav>
      <div class="topbar-actions">
        <a href="../instructor/notifications.html" class="icon-btn" aria-label="Bildirishnomalar"><i class="bi bi-bell-fill"></i><span class="dot"></span></a>
        <div class="avatar avatar-teach">AY</div>
      </div>
    </header>

    <main class="content" data-filterable>
      <div class="page-header">
        <div><h1>Sharhlar</h1><p class="text-muted mt-4">Talabalar sharhlarini ko'ring va javob bering.</p></div>
      </div>

      <!-- STATS — raqamlar js/profile-stats.js dagi resolverlardan
           (`isloh_reviews` + `isloh_review_replies` do'konlari). -->
      <div class="wk-grid-4 mt-20">
        <div class="card card-pad stat-card"><div class="stat-icon tint-warning"><i class="bi bi-star-fill"></i></div><div class="stat-value" data-stat="reviewAverage">—</div><div class="stat-label">Sharhlardan o'rtacha</div></div>
        <div class="card card-pad stat-card"><div class="stat-icon tint-violet"><i class="bi bi-chat-square-text-fill"></i></div><div class="stat-value" data-stat="reviewCount">—</div><div class="stat-label">Jami sharhlar</div></div>
        <div class="card card-pad stat-card"><div class="stat-icon tint-green"><i class="bi bi-reply-fill"></i></div><div class="stat-value" data-stat="replyRate">—</div><div class="stat-label">Javob berish darajasi</div></div>
        <div class="card card-pad stat-card"><div class="stat-icon tint-danger"><i class="bi bi-hourglass-split"></i></div><div class="stat-value" data-stat="pendingReplies">—</div><div class="stat-label">Javobsiz qolgan</div></div>
      </div>

      <!-- RATING SUMMARY — o'rtacha ball, yulduzlar va taqsimot chiziqlari
           js/instructor-reviews.js tomonidan sharhlardan hisoblanadi. -->
      <div class="card card-pad mt-18">
        <div class="rating-summary">
          <div class="rating-summary-score">
            <div class="val" data-review-average>—</div>
            <div class="rating-stars" data-review-average-stars></div>
            <div class="cnt"><span data-review-total>0</span> ta sharh asosida</div>
          </div>
          <div class="rating-bars" data-review-bars></div>
        </div>
      </div>

      <div class="split-aside mt-18">
        <!-- FILTER RAIL -->
        <div class="card card-pad">
          <div class="section-header"><h3>Filtr</h3></div>
          <!-- Guruh kaliti `ratingBand`: "3 ★ va past" bitta qiymat bilan
               ishlashi kerak, js/filterable.js esa aniq moslikni tekshiradi
               (js/review-store.js — isloh_reviewRatingBand). -->
          <div class="filter-bar is-stacked" data-filter-group="ratingBand">
            <button class="filter-chip active" data-filter-value="all">Barchasi</button>
            <button class="filter-chip" data-filter-value="5">5 ★</button>
            <button class="filter-chip" data-filter-value="4">4 ★</button>
            <button class="filter-chip" data-filter-value="low">3 ★ va past</button>
          </div>
          <div class="filter-bar is-stacked mt-16" data-filter-group="reply">
            <button class="filter-chip active" data-filter-value="all">Holatidan qat'i nazar</button>
            <button class="filter-chip" data-filter-value="pending">Javobsiz</button>
            <button class="filter-chip" data-filter-value="replied">Javob berilgan</button>
          </div>
          <div class="topbar-search w-100 mt-16"><i class="bi bi-search"></i><input data-filter-search placeholder="Sharh matnidan qidirish..." aria-label="Sharh matnidan qidirish"></div>
        </div>

        <!-- REVIEWS LIST — kartochkalar js/instructor-reviews.js tomonidan
             `isloh_reviews` do'konidan chiziladi, javoblar esa
             `isloh_review_replies` dan (shakli o'zgarmadi). -->
        <div class="card card-pad">
          <div data-review-list></div>

          <div class="empty-state" data-filter-empty style="display:none;">
            <div class="empty-icon"><i class="bi bi-star"></i></div><div class="empty-title">Sharh topilmadi</div><div class="empty-sub">Bu filtr yoki qidiruv bo'yicha sharh yo'q.</div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- SHARHGA JAVOB — javob isloh_review_replies do'koniga saqlanadi -->
<div class="modal-overlay" id="review-reply-modal" role="dialog" aria-modal="true" aria-labelledby="review-reply-title" hidden>
  <div class="modal">
    <div class="modal-head">
      <b id="review-reply-title">Sharhga javob berish</b>
      <button type="button" class="icon-btn icon-btn-sm" data-modal-close="review-reply-modal" aria-label="Yopish"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <div class="review-quote" data-review-quote></div>
      <div class="field mt-14 mb-0">
        <label for="review-reply-input">Sizning javobingiz</label>
        <textarea id="review-reply-input" data-review-reply-input rows="4" placeholder="Talabaga javob yozing..."></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-outline btn-sm" data-modal-close="review-reply-modal">Bekor qilish</button>
      <button type="button" class="btn btn-teach btn-sm" data-review-reply-submit><i class="bi bi-send"></i> Javobni yuborish</button>
    </div>
  </div>
</div>

<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/chat-store.js"></script>
<script src="../../js/profile.js"></script>
<script src="../../js/dropdown.js"></script>
<script src="../../js/user-menu.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/review-store.js"></script>
<script src="../../js/profile-stats.js"></script>
<script src="../../js/instructor-reviews.js"></script>
<script src="../../js/filterable.js"></script>
<script src="../../js/modal.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/notification-store.js"></script>
</body>
</html>
