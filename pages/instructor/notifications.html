<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildirishnomalar — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="instructor" data-active="notifications">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <nav class="breadcrumb-demo" aria-label="Breadcrumb"><span>Instructor</span><span class="sep">/</span><span class="current">Bildirishnomalar</span></nav>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn" aria-label="Bildirishnomalar"><i class="bi bi-bell-fill"></i><span class="dot"></span></a>
        <div class="avatar avatar-teach">AY</div>
      </div>
    </header>

    <main class="content">
      <!-- Sarlavhadagi raqam ham, ro'yxat ham js/notifications.js tomonidan
           `isloh_notifications` do'konidan chiziladi (markupda bironta
           bildirishnoma yozilmagan). Filtr, arxiv va qidiruv ataylab yo'q. -->
      <div class="page-header items-end mb-18">
        <div>
          <h1>Bildirishnomalar</h1>
          <p class="text-muted mt-4"><span data-notif-count="unread">0</span> ta o'qilmagan · jami <span data-notif-count="all">0</span></p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" data-notif-mark-all data-i18n="notif.markAll"><i class="bi bi-check2-all"></i> Barchasini o'qilgan deb belgilash</button>
      </div>

      <div class="card mw-640" data-notif-list></div>
    </main>
  </div>
</div>

     yorlig'ini js/datetime.js o'sha funksiyaga topshiradi. -->
