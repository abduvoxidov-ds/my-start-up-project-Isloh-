<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talabalar — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="instructor" data-active="students">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <nav class="breadcrumb-demo" aria-label="Breadcrumb"><span>Instructor</span><span class="sep">/</span><span class="current">Talabalar</span></nav>
      <div class="topbar-actions">
        <a href="../instructor/notifications.html" class="icon-btn" aria-label="Bildirishnomalar"><i class="bi bi-bell-fill"></i><span class="dot"></span></a>
        <div class="avatar avatar-teach">AY</div>
      </div>
    </header>

    <main class="content" data-filterable>
      <div class="page-header">
        <div><h1>Talabalar</h1><p class="text-muted mt-4">Talabalaringizning o'quv jarayonini kuzating.</p></div>
        <button class="btn btn-outline" data-export-csv="isloh-talabalar"><i class="bi bi-download"></i> Eksport</button>
      </div>

      <!-- STATS — raqamlar js/profile-stats.js dagi resolverlardan
           (`isloh_enrollments` do'koni), sahifa o'zi hech narsa sanamaydi. -->
      <div class="wk-grid-4 mt-20">
        <div class="card card-pad stat-card"><div class="stat-icon tint-violet"><i class="bi bi-people-fill"></i></div><div class="stat-value" data-stat="enrolledStudents">—</div><div class="stat-label">Ro'yxatdagi talabalar</div></div>
        <div class="card card-pad stat-card"><div class="stat-icon tint-green"><i class="bi bi-lightning-fill"></i></div><div class="stat-value" data-stat="activeStudents">—</div><div class="stat-label">Bu hafta faol</div></div>
        <div class="card card-pad stat-card"><div class="stat-icon tint-warning"><i class="bi bi-graph-up"></i></div><div class="stat-value" data-stat="avgProgress">—</div><div class="stat-label">O'rtacha jarayon</div></div>
        <div class="card card-pad stat-card"><div class="stat-icon tint-danger"><i class="bi bi-person-dash"></i></div><div class="stat-value" data-stat="inactiveStudents">—</div><div class="stat-label">Faol emas</div></div>
      </div>

      <!-- FILTERS — kurs chiplari ham do'kondan chiziladi (qaysi kurslarda
           talaba bor bo'lsa, o'shalar), shuning uchun kurs nomi o'zgarsa
           chip ham o'zgaradi. -->
      <div class="page-header mt-22">
        <div class="filter-bar" data-filter-group="course" data-student-filters></div>
        <div class="flex gap-10 items-center">
          <div class="topbar-search sw-220"><i class="bi bi-search"></i><input data-filter-search placeholder="Talaba qidirish..." aria-label="Talaba qidirish"></div>
          <select class="btn btn-outline select-btn" aria-label="Saralash"><option>Jarayon bo'yicha</option><option>Ism bo'yicha</option><option>Faollik bo'yicha</option></select>
        </div>
      </div>

      <!-- TABLE -->
      <div class="card mt-16 overflow-hidden">
        <div class="itable-wrap">
          <table class="itable" data-export-table>
            <thead><tr><th>Talaba</th><th>Joriy kurs</th><th>Jarayon</th><th>O'rtacha ball</th><th>Seriya</th><th>Faollik</th><th data-export-skip>Amallar</th></tr></thead>
            <!-- Qatorlar js/instructor-students.js tomonidan
                 `isloh_enrollments` do'konidan chiziladi. -->
            <tbody data-student-rows></tbody>
          </table>
        </div>
        <div class="empty-state" data-filter-empty style="display:none;">
          <div class="empty-icon"><i class="bi bi-person-x"></i></div><div class="empty-title">Talaba topilmadi</div><div class="empty-sub">Bu filtr yoki qidiruv bo'yicha talaba yo'q.</div>
        </div>
      </div>

      <!-- Kurs yozuvidagi umumiy talaba soni bilan ro'yxatdagi talabalar
           soni farqi shu yerda ochiq aytiladi (js/instructor-students.js) —
           sahifa "6 talaba" deb turib, dashboard "2,330" demasin. -->
      <div class="mt-12" data-student-coverage></div>

    </main>
  </div>
</div>

<!-- TALABA TAFSILOTI — qatordagi ma'lumotdan to'ldiriladi -->
<div class="modal-overlay" id="student-detail-modal" role="dialog" aria-modal="true" aria-labelledby="student-detail-title" hidden>
  <div class="modal">
    <div class="modal-head">
      <b id="student-detail-title" data-student-detail-name>Talaba</b>
      <button type="button" class="icon-btn icon-btn-sm" data-modal-close="student-detail-modal" aria-label="Yopish"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <div class="text-sm text-muted" data-student-detail-email></div>
      <div class="mt-12" data-student-detail-rows></div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-outline btn-sm" data-modal-close="student-detail-modal">Yopish</button>
      <a href="messages.html" class="btn btn-teach btn-sm" data-student-detail-message><i class="bi bi-chat-dots"></i> Xabar yozish</a>
    </div>
  </div>
</div>

<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/chat-store.js"></script>
<script src="../../js/profile.js"></script>
<script src="../../js/dropdown.js"></script>
<script src="../../js/user-menu.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/api.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/enrollment-store.js"></script>
<script src="../../js/profile-stats.js"></script>
<!-- instructor-students.js filterable.js DAN OLDIN: kurs chiplari va
     qatorlar avval chiziladi, keyin umumiy filtr moduli ularga ulanadi
     (js/instructor-courses.js dagi bir xil sabab). -->
<script src="../../js/instructor-students.js"></script>
<script src="../../js/filterable.js"></script>
<script src="../../js/modal.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/table-export.js"></script>
<script src="../../js/notification-store.js"></script>
</body>
</html>
