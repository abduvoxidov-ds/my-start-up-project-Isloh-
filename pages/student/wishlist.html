<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xohishlar ro'yxati — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .wl-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-top:18px; }
  @media (max-width:1100px){ .wl-grid{grid-template-columns:repeat(2,1fr);} }
  .wl-cover { height:100px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; position:relative; }
  .wl-cover .fav-toggle.active { color:#fff; background:rgba(0,0,0,0.15); }
  .wl-cover .fav-toggle { position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.85); }
  .wl-price-row { display:flex; align-items:center; gap:8px; margin-top:8px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="marketplace">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <main class="content">
      <div class="page-header">
        <div><h1>Xohishlar ro'yxati</h1><p>Keyinroq sotib olish uchun saqlangan kurslar. <span data-wishlist-count>2</span> ta kurs.</p></div>
        <a href="marketplace.html" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Marketplace'ga qaytish</a>
      </div>

      <div class="wl-grid" data-wishlist-list></div>

      <div class="empty-state card" data-wishlist-empty style="display:none; margin-top:16px;">
        <div class="empty-icon"><i class="bi bi-heart"></i></div>
        <div class="empty-title">Xohishlar ro'yxati bo'sh</div>
        <div class="empty-sub">Marketplace'da yoqqan kurslarni yurak belgisi orqali saqlang.</div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/wishlist.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/marketplace.js"></script>
</body>
</html>
