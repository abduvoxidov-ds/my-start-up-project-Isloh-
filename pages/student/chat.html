<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<!-- Chat shell styles now live in css/widgets.css (Sprint 4B — shared with Instructor Messages) -->
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="chat">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <div class="chat-shell">
      <!-- CHAT LIST -->
      <div class="chat-list-col">
        <div class="chat-list-head" style="display:flex; justify-content:space-between; align-items:center;">
          <h3 style="font-size:17px;">Suhbatlar</h3>
          <button class="btn btn-primary btn-sm" data-new-chat><i class="bi bi-plus-lg"></i> Yangi chat</button>
        </div>
        <div class="chat-search"><i class="bi bi-search"></i><input type="text" id="chat-search-input" placeholder="Suhbatlarni qidirish..." aria-label="Suhbatlarni qidirish"></div>

        <div style="overflow-y:auto; flex:1;" data-chat-list></div>
        <div class="empty-state" data-chat-list-empty style="display:none; padding:32px 18px;">
          <div class="empty-icon"><i class="bi bi-chat-dots"></i></div>
          <div class="empty-title">Suhbat topilmadi</div>
          <div class="empty-sub">"Yangi chat" orqali email bilan boshlang.</div>
        </div>
      </div>

      <!-- THREAD -->
      <div class="chat-thread">
        <div data-chat-empty-state style="flex:1; display:flex; align-items:center; justify-content:center;">
          <div class="empty-state">
            <div class="empty-icon"><i class="bi bi-chat-square-text"></i></div>
            <div class="empty-title">Suhbatni tanlang</div>
            <div class="empty-sub">Chapdagi ro'yxatdan birini tanlang yoki "Yangi chat" orqali boshlang.</div>
          </div>
        </div>

        <div data-chat-active-thread style="flex:1; min-height:0; display:none; flex-direction:column;">
          <div class="thread-head">
            <div style="display:flex; align-items:center; gap:12px;">
              <div class="presence-wrap"><div class="avatar" data-thread-avatar></div><span class="presence-dot" data-thread-presence></span></div>
              <div class="info">
                <div class="name" data-thread-name></div>
                <div class="sub" data-thread-status></div>
              </div>
            </div>
          </div>

          <div class="thread-body" data-thread-body></div>

          <div class="thread-input">
            <button class="icon-btn" data-chat-attach aria-label="Fayl biriktirish"><i class="bi bi-paperclip"></i></button>
            <input type="text" id="chat-message-input" placeholder="Xabar yozing..." aria-label="Xabar yozing">
            <button class="send-btn" data-chat-send aria-label="Yuborish"><i class="bi bi-send-fill"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="new-chat-modal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 style="font-size:15px;">Yangi chat boshlash</h3>
      <button class="icon-btn" data-modal-close aria-label="Yopish"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body">
      <input type="email" id="new-chat-email" placeholder="Foydalanuvchi email manzilini kiriting..." style="width:100%; border:1.5px solid var(--border-soft); border-radius:var(--r-md); padding:11px 14px; font-size:14px; outline:none;">
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-modal-close>Bekor qilish</button>
      <button class="btn btn-primary" data-new-chat-submit><i class="bi bi-chat-dots"></i> Boshlash</button>
    </div>
  </div>
</div>

<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/modal.js"></script>
<script src="../../js/chat.js"></script>
</body>
</html>
