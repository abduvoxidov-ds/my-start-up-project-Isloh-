<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Backend Development — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<!-- Sahifa tartibi (.detail-grid/.lesson-row va h.k.) css/widgets.css ga ko'chirildi (mobil bosqichi) -->
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="courses">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <!-- Topbar ataylab yo'q: profil va sozlamalar sahifalaridagi kabi, bu
       sahifada ham kontent to'g'ridan-to'g'ri boshlanadi. Mobil menyu
       tugmasini js/sidebar.js kontent tepasiga o'zi qo'yadi. -->
  <div class="main-col">
    <main class="content">
      <a href="courses.html" class="back-link"><i class="bi bi-arrow-left"></i> Orqaga</a>

      <!-- Sarlavha, dastur va progress `?id=` bo'yicha to'ldiriladi
           (js/course-detail.js). Quyidagi matnlar — zaxira qiymatlar. -->
      <div class="detail-grid">
        <div>
          <div class="card card-pad">
            <div style="display:flex; gap:18px; align-items:center;">
              <div class="course-cover" style="width:88px; height:88px; border-radius:16px; background:linear-gradient(135deg,#306998,#FFD43B); flex-shrink:0;" data-detail-cover><i class="bi bi-filetype-py" style="font-size:34px;" data-detail-icon></i></div>
              <div>
                <span class="badge badge-neutral" data-detail-badge>Barcha darajalar</span>
                <h2 style="font-size:20px; margin-top:8px;" data-detail-title>Python Backend Development</h2>
                <p style="color:var(--ink-500); font-size:13px; margin-top:4px;" data-detail-summary>Django, DRF, PostgreSQL, Docker va zamonaviy backend rivojlantirish</p>
              </div>
            </div>
            <div style="margin-top:18px; display:flex; justify-content:space-between; align-items:center; font-size:13px;">
              <span style="font-weight:600;">Sizning progressingiz</span>
              <span style="color:var(--violet-600); font-weight:700;" data-detail-progress-pct>0%</span>
            </div>
            <div class="progress-track" style="margin-top:6px;"><div class="progress-fill" style="width:0%;" data-detail-progress-fill></div></div>
            <div style="margin-top:8px; text-align:right;"><a href="learning-progress.html" style="font-size:12.5px; color:var(--violet-600); font-weight:600;"><i class="bi bi-graph-up"></i> To'liq jarayonni ko'rish</a></div>
          </div>

          <div class="card card-pad" style="margin-top:18px;">
            <div class="tab-strip">
              <div class="tab-item active">Dastur</div>
              <div class="tab-item">Umumiy</div>
              <div class="tab-item">Sharhlar</div>
              <div class="tab-item">Savol-javob</div>
            </div>

            <div data-detail-modules></div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:18px;">
          <div class="card card-pad">
            <h3 style="font-size:15px;">Bu kursda o'rganasiz</h3>
            <div data-detail-outcomes></div>
          </div>
          <div class="card card-pad">
            <h3 style="font-size:15px;">Kurs tarkibi</h3>
            <div data-detail-includes></div>
          </div>
          <div class="card card-pad">
            <h3 style="font-size:15px; margin-bottom:10px;">Kurs bilan bo'lishing</h3>
            <div style="display:flex; gap:10px;">
              <button class="icon-btn" aria-label="Havolani nusxalash"><i class="bi bi-link-45deg"></i></button>
              <button class="icon-btn" aria-label="Facebook'da ulashish"><i class="bi bi-facebook"></i></button>
              <button class="icon-btn" aria-label="X'da ulashish"><i class="bi bi-twitter-x"></i></button>
              <button class="icon-btn" aria-label="Instagram'da ulashish"><i class="bi bi-instagram"></i></button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/api.js"></script>
<script src="../../js/escape.js"></script>
<script src="../../js/ui-feedback.js"></script>
<script src="../../js/auth-guard.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/chat-store.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<!-- Katalog + kurs mazmuni, keyin sahifani `?id=` bo'yicha to'ldiruvchi
     modul. lesson-viewer.js — faqat progress do'konini o'qish uchun. -->
<script src="../../js/lesson-viewer.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/marketplace.js"></script>
<script src="../../js/course-content.js"></script>
<script src="../../js/course-detail.js"></script>
</body>
</html>
