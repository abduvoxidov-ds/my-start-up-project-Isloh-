<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izohlarim — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="courses">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <nav class="breadcrumb-demo" aria-label="Breadcrumb"><a class="text-inherit" href="course-detail.html">Docker for Beginners</a><span class="sep">/</span><span class="current">Izohlarim</span></nav>
      <div class="topbar-actions">
        <a href="../shared/notifications.html" class="icon-btn" aria-label="Bildirishnomalar"><i class="bi bi-bell-fill"></i><span class="dot"></span></a>
        <div class="avatar">SM</div>
      </div>
    </header>

    <main class="content" data-filterable>
      <div class="page-header">
        <div>
          <h1>Izohlarim</h1>
          <p>Shaxsiy va guruhdosh talabalar bilan bo'lishilgan izohlaringiz.</p>
        </div>
        <button class="btn btn-teach btn-sm" data-note-create><i class="bi bi-plus-lg"></i> Yangi izoh</button>
      </div>

      <!-- COMPOSER (hidden until "Yangi izoh" is clicked) -->
      <div class="card card-pad mt-16" data-note-composer hidden>
        <div class="field"><label for="note-title-input">Sarlavha</label><input id="note-title-input" data-note-title-input placeholder="Izoh sarlavhasi"></div>
        <div class="field"><label for="note-body-input">Matn</label><textarea id="note-body-input" data-note-body-input class="editor-textarea note-body-input" placeholder="Izohingizni yozing..."></textarea></div>
        <div class="field field-last"><label for="note-tags-input">Teglar</label><input id="note-tags-input" data-note-tags-input placeholder="Vergul bilan ajrating: docker, muhim"></div>
        <div class="note-composer-foot"><button class="btn btn-teach btn-sm" data-note-save><i class="bi bi-save"></i> Saqlash</button></div>
      </div>

      <div class="notes-filter-bar">
        <div class="chip-row" data-filter-group="scope">
          <button class="category-chip active" data-filter-value="all">Barchasi</button>
          <button class="category-chip" data-filter-value="personal">Shaxsiy</button>
          <button class="category-chip" data-filter-value="shared">Bo'lishilgan</button>
          <button class="category-chip" data-filter-value="pinned">Qadalgan</button>
        </div>
        <div class="topbar-search notes-search"><i class="bi bi-search"></i><input data-filter-search placeholder="Izohlarni qidirish..." aria-label="Izohlarni qidirish"></div>
      </div>

      <!-- Teg chiplari do'kondagi haqiqiy teglardan chiziladi (js/notes.js) -->
      <div class="chip-row notes-tag-row" data-note-tag-filter hidden></div>

      <!-- Kartochkalar js/notes.js tomonidan isloh_notes do'konidan chiziladi -->
      <div class="notes-grid mt-16" data-notes-grid></div>

      <!-- Ko'rinishini js/filterable.js boshqaradi (style.display) — shuning
           uchun bu yerda hidden/inline style qo'yilmaydi -->
      <div class="empty-state" data-filter-empty>
        <div class="empty-icon"><i class="bi bi-journal-text"></i></div>
        <div class="empty-title" data-notes-empty-title>Izoh topilmadi</div>
        <div class="empty-sub" data-notes-empty-sub>Boshqa filtr yoki qidiruv so'zini sinab ko'ring.</div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/profile.js"></script>
<script src="../../js/dropdown.js"></script>
<script src="../../js/user-menu.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/filterable.js"></script>
<script src="../../js/notes-store.js"></script>
<script src="../../js/notes.js"></script>
</body>
</html>
