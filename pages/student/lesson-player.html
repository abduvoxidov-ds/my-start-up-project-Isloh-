<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kursga kirish — Lesson Player — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="fs-topbar">
  <a href="course-player.html" class="icon-btn" aria-label="To'liq ekrandan chiqish"><i class="bi bi-fullscreen-exit"></i></a>
  <div>
    <div class="fs-title">Docker for Beginners</div>
    <div class="fs-sub">1-modul · Kursga kirish</div>
  </div>
  <div class="fs-topbar-actions">
    <button class="btn btn-outline btn-sm" data-ai-drawer-trigger><i class="bi bi-stars"></i> AI Yordamchi</button>
    <button class="icon-btn" data-lesson-bookmark aria-label="Xatcho'p"><i class="bi bi-bookmark"></i></button>
    <a href="course-player.html" class="btn btn-outline btn-sm"><i class="bi bi-list-ul"></i> Kurs tarkibi</a>
  </div>
</div>

<div class="fs-body" data-ai-context="course-player" data-course-id="docker-for-beginners">
  <div class="player-shell is-fullscreen">
    <section class="lesson-viewer">
      <div class="lesson-header">
        <div>
          <!-- Sarlavha va meta faol dars qatoridan js/lesson-viewer.js orqali
               to'ldiriladi. Bu yerdagi qatorlarda modul/vaqt yo'q, shuning
               uchun bo'sh meta bandlari avtomat yashiriladi. -->
          <h1 class="lesson-header-title" data-lesson-title tabindex="-1"></h1>
          <div class="lesson-header-meta">
            <span data-lesson-meta-item><i class="bi bi-collection-play"></i> <span data-lesson-module></span></span>
            <span data-lesson-meta-item><i class="bi bi-clock"></i> <span data-lesson-time></span></span>
          </div>
        </div>
      </div>

      <!-- Dars almashganini skrin-riderga e'lon qiladi (js/lesson-viewer.js) -->
      <div class="sr-only" aria-live="polite" data-lesson-announcer></div>

      <!-- Dars ro'yxati bu yerda ham js/course-data.js dan chiziladi, lekin
           ko'rinmaydi (.is-registry): chalg'itmaydigan rejimda yon panel yo'q,
           ammo Oldingi/Keyingi, jarayon va izohlar mantig'i aynan bir xil
           qatorlar ustida ishlaydi — markup takrorlanmaydi. -->
      <div class="is-registry" data-player-modules aria-hidden="true"></div>

        <!-- ================= SAHNALAR =================
             Butun sahifada BITTA <video> bor: dars almashganda faqat manba
             almashadi. Har dars uchun alohida <video> yaratilsa, brauzer
             har biri uchun dekoder va bufer ushlab turardi. -->

        <!-- VIDEO -->
        <div class="lv-stage lv-stage-video" data-stage="video" data-video-stage hidden>
          <video class="lv-video" data-lesson-video preload="metadata" playsinline
                 controlslist="nodownload" aria-label="Dars videosi">
            <track kind="captions" srclang="uz" label="O'zbekcha" default>
            Brauzeringiz video formatini qo'llab-quvvatlamaydi.
          </video>

          <div class="lv-scrim" aria-hidden="true"></div>

          <button class="lv-big-play" data-video-bigplay aria-label="O'ynatish">
            <i class="bi bi-play-fill" aria-hidden="true"></i>
          </button>

          <div class="lv-controls" data-video-controls>
            <button class="lv-btn" data-video-toggle aria-label="O'ynatish"><i class="bi bi-play-fill" aria-hidden="true"></i></button>
            <button class="lv-btn" data-video-seek="-10" aria-label="10 soniya orqaga"><i class="bi bi-skip-backward-fill" aria-hidden="true"></i></button>
            <button class="lv-btn" data-video-seek="10" aria-label="10 soniya oldinga"><i class="bi bi-skip-forward-fill" aria-hidden="true"></i></button>

            <span class="lv-time"><span data-video-current>0:00</span> / <span data-video-duration>0:00</span></span>

            <!-- Ko'rinishi 4px, bosish maydoni 24px (WCAG 2.5.8) -->
            <span class="lv-scrub-wrap">
              <span class="lv-scrub-fill" data-video-progress aria-hidden="true"></span>
              <input class="lv-scrub" type="range" min="0" max="0" step="1" value="0"
                     data-video-scrub aria-label="Video pozitsiyasi">
            </span>

            <button class="lv-btn" data-video-mute aria-label="Ovozni o'chirish"><i class="bi bi-volume-up-fill" aria-hidden="true"></i></button>
            <input class="lv-volume" type="range" min="0" max="1" step="0.05" value="1"
                   data-video-volume aria-label="Ovoz balandligi">

            <select class="lv-select" data-video-speed aria-label="O'ynatish tezligi">
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="1.75">1.75×</option>
              <option value="2">2×</option>
            </select>

            <button class="lv-btn" data-video-captions aria-label="Subtitr" aria-pressed="false"><i class="bi bi-badge-cc-fill" aria-hidden="true"></i></button>
            <button class="lv-btn" data-video-pip aria-label="Alohida oynada"><i class="bi bi-pip" aria-hidden="true"></i></button>
            <button class="lv-btn" data-video-fullscreen aria-label="To'liq ekran"><i class="bi bi-arrows-fullscreen" aria-hidden="true"></i></button>
          </div>

          <!-- Yuklanish / bufer -->
          <div class="lv-stage-state lv-stage-loading" data-video-loading hidden>
            <div class="lv-spinner" aria-hidden="true"></div>
            <span class="sr-only">Video yuklanmoqda</span>
          </div>

          <!-- Xatolik: HTMLMediaElement.error kodi bo'yicha aniq xabar -->
          <div class="lv-stage-state lv-stage-error" data-video-error hidden role="alert">
            <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
            <div class="lv-stage-error-title">Videoni yuklab bo'lmadi</div>
            <div class="lv-stage-error-sub" data-video-error-sub></div>
            <button class="btn btn-outline btn-sm" data-video-retry><i class="bi bi-arrow-clockwise"></i> Qayta urinish</button>
          </div>

          <div class="lv-offline-badge" data-video-offline hidden>
            <i class="bi bi-wifi-off" aria-hidden="true"></i> Internet aloqasi yo'q
          </div>
        </div>

        <!-- MAQOLA -->
        <div data-stage="article" hidden>
          <div class="lv-article-body"></div>
        </div>

        <!-- KOD -->
        <div data-stage="code" hidden>
          <div class="lv-code-body">
            <div class="editor-block-label"></div>
            <div class="lv-code-block"></div>
          </div>
        </div>

        <!-- TEST / TOPSHIRIQ -->
        <div data-stage="launch" hidden>
          <div class="lv-launch-card">
            <div class="lv-launch-icon"></div>
            <div class="lv-launch-title"></div>
            <div class="lv-launch-sub"></div>
            <button class="btn btn-teach" data-launch-action></button>
          </div>
        </div>

      <div class="lesson-actions-row">
        <button class="btn btn-outline btn-sm" data-mark-complete><i class="bi bi-check2"></i> Yakunlandi deb belgilash</button>
      </div>

      <div class="lesson-nav-bar">
        <button class="btn btn-outline btn-sm" data-lesson-prev><i class="bi bi-arrow-left"></i> Oldingi</button>
        <span class="lnb-center"><i class="bi bi-collection-play"></i> <span data-lesson-counter></span></span>
        <button class="btn btn-teach btn-sm" data-lesson-next>Keyingi <i class="bi bi-arrow-right"></i></button>
      </div>
    </section>
  </div>
</div>

<!-- AI DRAWER (Sprint 8A) -->
<div id="ai-drawer-mount"></div>

<script defer src="../../js/theme.js"></script>
<script defer src="../../js/toast.js"></script>
<script defer src="../../js/modal.js"></script>
<script defer src="../../js/tabs.js"></script>
<script defer src="../../js/bookmarks.js"></script>
<script defer src="../../js/notes-store.js"></script>
<!-- TARTIB MUHIM — course-player.html dagi bilan bir xil sabab -->
<script defer src="../../js/course-data.js"></script>
<script defer src="../../js/lesson-video.js"></script>
<script defer src="../../js/course-player.js"></script>
<script defer src="../../js/lesson-viewer.js"></script>
<script defer src="../../js/progress-metrics.js"></script>
<script defer src="../../js/ai-assistant.js"></script>
<script defer src="../../js/ai-panel.js"></script>
<script defer src="../../js/ai-store.js"></script>
<script defer src="../../js/ai-chat.js"></script>
</body>
</html>
