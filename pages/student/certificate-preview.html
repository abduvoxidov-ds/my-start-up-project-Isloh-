<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sertifikat — Python Backend Development — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .cert-preview-shell { max-width: 760px; margin: 0 auto; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="certificates">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <main class="content">
      <a href="certificates.html" class="back-link" data-cert-print-hide><i class="bi bi-arrow-left"></i> Sertifikatlarga qaytish</a>

      <div class="cert-preview-shell" data-cert-preview>
        <!-- Coursera-style "Officially Verified Certificate" banner, shown whenever ?id= or ?verify= resolves -->
        <div class="cert-verify-banner" data-cert-verify-banner hidden>
          <i class="bi bi-patch-check-fill"></i>
          <div>
            <div class="cert-verify-banner-title">Rasmiy tasdiqlangan sertifikat</div>
            <div class="cert-verify-banner-sub" data-cert-verify-timestamp></div>
          </div>
        </div>

        <div data-cert-content hidden>
          <div class="card certificate-card">
            <div class="certificate-face">
              <!-- Optional instructor organization co-branding (js/certificate-engine.js isloh_renderCertOrganization) -->
              <div class="cert-org-logo" data-cert-org-logo hidden></div>

              <div class="certificate-seal-lg"><i class="bi bi-patch-check-fill"></i></div>
              <div class="certificate-kicker">Yakunlash sertifikati</div>
              <div class="certificate-name" data-cert-name></div>
              <div class="certificate-course" data-cert-course></div>
              <div class="certificate-meta-row">
                <span data-cert-instructor></span>
                <span data-cert-date></span>
                <span data-cert-id></span>
              </div>
              <div class="certificate-signature-row" data-cert-org hidden></div>
            </div>
            <div class="card-pad" data-cert-print-hide style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center;">
              <button class="btn btn-teach btn-sm" data-cert-action="download"><i class="bi bi-download"></i> Yuklab olish</button>
              <button class="btn btn-outline btn-sm" data-cert-action="linkedin"><i class="bi bi-linkedin"></i> LinkedIn'ga qo'shish</button>
              <button class="btn btn-outline btn-sm" data-cert-action="share"><i class="bi bi-share"></i> Ulashish</button>
            </div>
          </div>

          <div class="card card-pad" style="margin-top:18px;">
            <h3 style="font-size:15px; margin-bottom:6px;">Yakunlash xulosasi</h3>
            <div class="completion-stat-row"><span class="text-muted">Kurs</span><span style="font-weight:600;" data-cert-stat-course></span></div>
            <div class="completion-stat-row"><span class="text-muted">Jami darslar</span><span style="font-weight:600;" data-cert-stat-lessons></span></div>
            <div class="completion-stat-row"><span class="text-muted">Testlar o'rtacha bali</span><span style="font-weight:600;" data-cert-stat-quiz></span></div>
            <div class="completion-stat-row"><span class="text-muted">Sarflangan vaqt</span><span style="font-weight:600;" data-cert-stat-time></span></div>
            <div class="completion-stat-row"><span class="text-muted">Yakunlangan sana</span><span style="font-weight:600;" data-cert-stat-completed-date></span></div>
          </div>
        </div>

        <div class="empty-state" data-cert-not-found hidden>
          <div class="empty-icon"><i class="bi bi-patch-question"></i></div>
          <div class="empty-title">Sertifikat topilmadi</div>
          <div class="empty-sub">Havola noto'g'ri yoki sertifikat hali berilmagan.</div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/profile.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/certificate-engine.js"></script>
</body>
</html>
