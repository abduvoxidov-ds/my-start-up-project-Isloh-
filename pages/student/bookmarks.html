<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saqlanganlar — Isloh</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="bookmarks">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <main class="content" data-filterable>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 style="font-size:24px;">Saqlanganlar</h1>
          <p style="color:var(--ink-500); margin-top:4px;"><span id="bookmark-total">0</span> ta material saqlangan.</p>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
          <div class="topbar-search" style="width:220px;"><i class="bi bi-search"></i><input data-filter-search placeholder="Saqlangan qidirish..." aria-label="Saqlangan qidirish"></div>
        </div>
      </div>

      <!-- FILTERS — faqat dars darajasidagi material turlari.
           Kurs darajasidagi ma'lumot "Mening kurslarim" sahifasida. -->
      <div class="filter-bar" data-filter-group="type" style="margin-top:20px;">
        <button class="filter-chip active" data-filter-value="all">Barchasi</button>
        <button class="filter-chip" data-filter-value="lesson">Darslar</button>
        <button class="filter-chip" data-filter-value="article">Maqolalar</button>
        <button class="filter-chip" data-filter-value="code">Kodlar</button>
        <button class="filter-chip" data-filter-value="note">Eslatmalar</button>
      </div>

      <div class="bm-layout">
        <!-- LIST — barcha kartochkalar js/bookmarks.js orqali
             isloh_bookmarks do'konidan chiziladi (statik demo yo'q) -->
        <div class="bm-list" data-bookmark-list>
          <!-- EMPTY STATE — matni do'kon bo'shligiga qarab JS'da almashadi -->
          <div class="empty-state" data-filter-empty style="display:none;">
            <div class="empty-icon"><i class="bi bi-bookmark-x"></i></div>
            <div class="empty-title" data-bookmark-empty-title>Hech narsa topilmadi</div>
            <div class="empty-sub" data-bookmark-empty-sub>Bu filtr yoki qidiruv bo'yicha saqlangan element yo'q.</div>
          </div>
        </div>

        <!-- SIDEBAR — so'nggi saqlanganlar, shu do'kondan -->
        <div class="wk-col">
          <div class="card card-pad" data-recent-card>
            <div class="section-header"><h3>So'nggi saqlangan</h3></div>
            <div data-recent-bookmarks></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/filterable.js"></script>
<script src="../../js/bookmarks.js"></script>
</body>
</html>
