<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savat — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .cart-layout { display:grid; grid-template-columns:1.7fr 1fr; gap:20px; align-items:start; margin-top:20px; }
  @media (max-width:900px){ .cart-layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="marketplace">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <main class="content">
      <div class="page-header">
        <div><h1>Savat</h1><p>Sotib olishdan oldin kurslaringizni ko'rib chiqing.</p></div>
        <a href="marketplace.html" class="btn btn-outline"><i class="bi bi-arrow-left"></i> Marketplace'ga qaytish</a>
      </div>

      <div class="cart-layout">
        <div>
          <div class="card" data-cart-list></div>

          <div class="empty-state card" data-cart-empty style="display:none; margin-top:16px;">
            <div class="empty-icon"><i class="bi bi-cart-x"></i></div>
            <div class="empty-title">Savat bo'sh</div>
            <div class="empty-sub">Marketplace'dan yangi kurslar qo'shing.</div>
          </div>

          <div class="card" style="margin-top:18px;" hidden>
            <div style="padding:16px 20px 0;"><h3 style="font-size:15px;">Keyinga saqlangan</h3></div>
            <div data-saved-list></div>
          </div>

          <div class="card card-pad coupon-row" style="margin-top:18px; display:flex; align-items:center; gap:10px;">
            <input type="text" id="coupon-input" placeholder="Kupon kodini kiriting" style="flex:1; border:1.5px solid var(--border-soft); border-radius:var(--r-md); padding:11px 14px; font-size:14px; outline:none;">
            <button class="btn btn-primary" id="coupon-apply">Qo'llash</button>
            <span class="coupon-code">ISLOH2026</span>
          </div>
        </div>

        <div class="card card-pad checkout-summary">
          <h3 style="font-size:16px; margin-bottom:14px;">Buyurtma xulosasi</h3>
          <div class="cs-row"><span>Oraliq summa</span><span data-sum-subtotal>0 so'm</span></div>
          <div class="cs-row cs-discount" data-sum-discount-row hidden><span>Chegirma</span><span data-sum-discount>0 so'm</span></div>
          <div class="cs-row cs-total"><span>Jami</span><span data-sum-total>0 so'm</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;" data-checkout-btn><i class="bi bi-credit-card"></i> Sotib olishga o'tish</a>
          <p style="font-size:11.5px; color:var(--ink-300); margin-top:10px; text-align:center;">30 kunlik pulni qaytarish kafolati</p>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/chat-store.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/toast.js"></script>
<script src="../../js/wishlist.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/marketplace.js"></script>
<script src="../../js/cart.js"></script>
</body>
</html>
