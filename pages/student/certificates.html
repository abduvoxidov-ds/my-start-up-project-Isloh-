<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sertifikatlar — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="certificates">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <main class="content" data-filterable>
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 style="font-size:24px;">Sertifikatlar</h1>
          <p style="color:var(--ink-500); margin-top:4px;">Qo'lga kiritgan va kutilayotgan sertifikatlaringiz.</p>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="filter-bar" data-filter-group="status" style="margin-top:20px;">
        <button class="filter-chip active" data-filter-value="all">Barchasi</button>
        <button class="filter-chip" data-filter-value="earned">Qo'lga kiritilgan</button>
        <button class="filter-chip" data-filter-value="progress">Jarayonda</button>
        <button class="filter-chip" data-filter-value="locked">Qulflangan</button>
      </div>

      <!-- GRID (rendered by js/certificate-engine.js from isloh_certificates + isloh_course_progress + isloh_purchased_courses) -->
      <div class="cert-grid" data-cert-grid style="margin-top:18px;"></div>

      <!-- EMPTY STATE -->
      <div class="empty-state" data-filter-empty style="display:none;">
        <div class="empty-icon"><i class="bi bi-patch-question"></i></div>
        <div class="empty-title">Sertifikat topilmadi</div>
        <div class="empty-sub">Qidiruv yoki filtr bo'yicha hech narsa yo'q. Boshqa so'z bilan urinib ko'ring.</div>
      </div>
    </main>
  </div>
</div>
<script src="../../js/navigation.js"></script>
<script src="../../js/sidebar.js"></script>
<script src="../../js/datetime.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/theme.js"></script>
<script src="../../js/course-store.js"></script>
<script src="../../js/marketplace.js"></script>
<script src="../../js/lesson-viewer.js"></script>
<script src="../../js/profile.js"></script>
<script src="../../js/certificate-engine.js"></script>
<script src="../../js/filterable.js"></script>
</body>
</html>
