<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mening kurslarim — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="courses">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <main class="content">
      <h1 style="font-size:24px;">Mening kurslarim</h1>

      <!-- ENROLLED — isloh_purchased_courses'dan (js/my-courses.js).
           Bu sahifada faqat sotib olingan kurslar ko'rsatiladi. -->
      <section class="course-section">
        <div class="course-grid" data-enrolled-courses></div>
        <div class="empty-state" data-enrolled-empty>
          <div class="empty-icon"><i class="bi bi-journal-bookmark"></i></div>
          <div class="empty-title">Hali kurs sotib olinmagan</div>
          <div class="empty-sub">Marketplace'dan kurs sotib oling — u shu yerda paydo bo'ladi.</div>
        </div>
      </section>

    </main>
  </div>
</div>
