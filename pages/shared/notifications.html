<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildirishnomalar — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" data-role="student" data-active="notifications">
    <div class="brand"><div class="brand-mark">I</div> Isloh</div>
    <nav class="nav-group" id="sidebar-nav"></nav>
    <div class="sidebar-footer" id="sidebar-footer-nav"></div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-search"><i class="bi bi-search"></i><input placeholder="Qidirish..." aria-label="Qidirish"></div>
      <div class="topbar-actions">
        <a href="notifications.html" class="icon-btn" aria-label="Bildirishnomalar"><i class="bi bi-bell-fill"></i><span class="dot"></span></a>
        <div class="avatar">SM</div>
      </div>
    </header>

    <main class="content">
      <div class="page-header">
        <div>
          <h1 style="font-size:24px;">Bildirishnomalar</h1>
          <p class="text-muted mt-4"><span data-notif-count="unread">0</span> ta o'qilmagan · jami <span data-notif-count="all">0</span></p>
        </div>
        <button type="button" class="btn btn-outline btn-sm" data-notif-mark-all><i class="bi bi-check2-all"></i> Barchasini o'qilgan deb belgilash</button>
      </div>

      <!-- M7: qatorlar js/notifications.js tomonidan js/notification-store.js
           do'konidan chiziladi. Ilgari bu yerda 5 ta qator qo'lda yozilgan
           edi — bosilmasdi, o'qilgan deb belgilanmasdi va o'qituvchi
           sahifasidagi ro'yxat bilan hech qanday aloqasi yo'q edi. -->
      <div class="card mw-640" data-notif-list></div>
    </main>
  </div>
</div>
