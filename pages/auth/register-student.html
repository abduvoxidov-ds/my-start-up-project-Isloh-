<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaba sifatida ro'yxatdan o'tish — Isloh</title>
<link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">

</head>
<body>
  <div class="auth-split">
    <div class="auth-panel">
      <div>
        <div class="brand"><div class="brand-mark">I</div> Isloh</div>
        <div class="steps"><span class="done"></span><span></span><span></span></div>
        <div style="font-size:12px; color:#9C98CC; margin-bottom: 40px;">1-qadam / 3</div>
        <h2 style="font-family:'Manrope',sans-serif; font-size:26px; font-weight:800; color:#ffffff;">Boshlash uchun ma'lumotlaringizni kiriting</h2>
        <p style="color:var(--on-indigo-muted); font-size:14px; margin-top:10px;">Talaba hisobingizni yarating</p>
      </div>
      <div style="font-size:12px; color:#807CB0;">© 2026 Isloh. Barcha huquqlar himoyalangan.</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-inner">
        <form novalidate onsubmit="event.preventDefault(); window.location.href='../student/dashboard.html';">
          <div class="field-error" data-error-for="form" hidden></div>
          <div class="field">
            <label for="fname">To'liq ism</label>
            <input id="fname" type="text" required data-auth-field="full_name" placeholder="Ismingizni kiriting">
            <div class="field-error" data-error-for="full_name" hidden></div>
          </div>
          <div class="field">
            <label for="email2">Email manzil</label>
            <input id="email2" type="email" required data-auth-field="email" placeholder="email@gmail.com">
            <div class="field-error" data-error-for="email" hidden></div>
          </div>
          <div class="field">
            <label for="pass2">Parol</label>
            <input id="pass2" type="password" required data-auth-field="password" placeholder="••••••••••••">
            <div class="field-error" data-error-for="password" hidden></div>
          </div>
          <div class="field">
            <label for="pass3">Parolni tasdiqlang</label>
            <input id="pass3" type="password" required data-auth-field="password_confirm" placeholder="••••••••••••">
            <div class="field-hint">Kamida 8 ta belgi</div>
            <div class="field-error" data-error-for="password_confirm" hidden></div>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="agree" required data-auth-field="agree">
            <label for="agree">Men <a href="#" style="color:var(--violet-600); font-weight:600;">Foydalanish shartlari</a> va <a href="#" style="color:var(--violet-600); font-weight:600;">Maxfiylik siyosati</a>ga roziman</label>
            <div class="field-error" data-error-for="agree" hidden></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Davom etish</button>
        </form>

        <p style="text-align:center; margin-top:22px; font-size:14px; color:var(--ink-500);">
          Hisobingiz bormi? <a href="login.html" style="color:var(--violet-600); font-weight:700;">Kirish</a>
        </p>
      </div>
    </div>
  </div>
  <script src="../../js/api.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/ui-feedback.js"></script>
  <script src="../../js/auth-guard.js"></script>
</body>
</html>
