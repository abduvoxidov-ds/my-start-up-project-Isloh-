<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaba sifatida ro'yxatdan o'tish — Isloh</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../../css/style.css">
<style>
  .steps { display:flex; gap:6px; margin: 22px 0 4px; }
  .steps span { height:4px; flex:1; border-radius:4px; background: rgba(255,255,255,0.15); }
  .steps span.done { background: var(--violet-500); }
  .checkbox-row { display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--ink-700); margin: 4px 0 20px; }
  .checkbox-row input { margin-top:3px; accent-color: var(--violet-600); }
</style>
</head>
<body>
  <div class="auth-split">
    <div class="auth-panel">
      <div>
        <div class="brand"><div class="brand-mark" aria-hidden="true"></div> Isloh</div>
        <div class="steps"><span class="done"></span><span></span><span></span></div>
        <div style="font-size:12px; color:#9C98CC; margin-bottom: 40px;">1-qadam / 3</div>
        <h2 style="font-family:'Manrope',sans-serif; font-size:26px; font-weight:800; color:#ffffff;">Boshlash uchun ma'lumotlaringizni kiriting</h2>
        <p style="color:#C9C6E8; font-size:14px; margin-top:10px;">Talaba hisobingizni yarating</p>
      </div>
      <div style="font-size:12px; color:#807CB0;">© 2026 Isloh. Barcha huquqlar himoyalangan.</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-inner">
        <form onsubmit="event.preventDefault(); window.location.href='../student/dashboard.html';">
          <div class="field">
            <label for="fname">To'liq ism</label>
            <input id="fname" type="text" placeholder="Ismingizni kiriting">
          </div>
          <div class="field">
            <label for="email2">Email manzil</label>
            <input id="email2" type="email" placeholder="email@gmail.com">
          </div>
          <div class="field">
            <label for="pass2">Parol</label>
            <input id="pass2" type="password" placeholder="••••••••••••">
          </div>
          <div class="field">
            <label for="pass3">Parolni tasdiqlang</label>
            <input id="pass3" type="password" placeholder="••••••••••••">
            <div class="field-hint">Kamida 8 ta belgi</div>
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="agree">
            <label for="agree">Men <a href="#" style="color:var(--violet-600); font-weight:600;">Foydalanish shartlari</a> va <a href="#" style="color:var(--violet-600); font-weight:600;">Maxfiylik siyosati</a>ga roziman</label>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Davom etish</button>
        </form>

        <p style="text-align:center; margin-top:22px; font-size:14px; color:var(--ink-500);">
          Hisobingiz bormi? <a href="login.html" style="color:var(--violet-600); font-weight:700;">Kirish</a>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
