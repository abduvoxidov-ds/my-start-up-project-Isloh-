<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Isloh</title>
  <link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
  <div class="auth-split">
    <div class="auth-panel">
      <div>
        <div class="brand">
          <div class="brand-mark">I</div> Isloh
        </div>
        <div class="auth-tagline" style="margin-top:60px;">Aqlliroq o'rganing,<br>Uzoqroq emas.</div>
        <div class="auth-sub">Barcha kurslaringiz, bitta platformada.<br>Bitta AI murabbiy bilan.</div>
      </div>
      <div style="font-size:12px; color:#807CB0;">© 2026 Isloh. Barcha huquqlar himoyalangan.</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-inner">
        <h2 style="font-size:26px;">Xush kelibsiz 👋</h2>
        <p style="color:var(--ink-500); font-size:14px; margin: 8px 0 28px;">Hisobingizga kirish uchun davom eting</p>

        <form onsubmit="event.preventDefault(); window.location.href='../student/dashboard.html';">
          <div class="field">
            <label for="email">Email manzil</label>
            <input id="email" type="email" placeholder="email@gmail.com">
          </div>
          <div class="field" style="margin-bottom:8px;">
            <label for="pass">Parol</label>
            <input id="pass" type="password" placeholder="••••••••">
          </div>
          <div class="remember-row">
            <label><input type="checkbox" style="accent-color:var(--violet-600);"> Meni eslab qol</label>
            <a href="#" style="color:var(--violet-600); font-weight:600;">Parolni unutdingizmi?</a>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Kirish</button>
        </form>

        <div class="divider">yoki davom eting</div>
        <div class="social-row">
          <button class="btn btn-outline btn-block"><i class="bi bi-google"></i> Google</button>
          <button class="btn btn-outline btn-block"><i class="bi bi-apple"></i> Apple</button>
        </div>

        <p style="text-align:center; margin-top:26px; font-size:14px; color:var(--ink-500);">
          Hisobingiz yo'qmi? <a href="register-role.html" style="color:var(--violet-600); font-weight:700;">Ro'yxatdan
            o'tish</a>
        </p>
      </div>
    </div>
  </div>
</body>

</html>
