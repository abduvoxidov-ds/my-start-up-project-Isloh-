<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yangi parol o'rnatish — Isloh</title>
  <link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
  <div class="auth-split">
    <div class="auth-panel">
      <div>
        <div class="brand">
          <div class="brand-mark">I</div> Isloh
        </div>
        <div class="auth-tagline">Aqlliroq o'rganing,<br>Uzoqroq emas.</div>
        <div class="auth-sub">Barcha kurslaringiz, bitta platformada.<br>Bitta AI murabbiy bilan.</div>
      </div>
      <div class="auth-legal">© 2026 Isloh. Barcha huquqlar himoyalangan.</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-inner">
        <h2 style="font-size:26px;">Yangi parol o'rnatish 🔒</h2>
        <p style="color:var(--ink-500); font-size:14px; margin: 8px 0 28px;">Hisobingiz uchun yangi xavfsiz parol kiriting</p>

        <form novalidate onsubmit="event.preventDefault(); window.location.href='login.html';">
          <div class="field-error" data-error-for="form" hidden></div>
          <div class="field">
            <label for="pass">Yangi parol</label>
            <input id="pass" type="password" required data-auth-field="password" placeholder="••••••••••••">
            <div class="field-error" data-error-for="password" hidden></div>
          </div>
          <div class="field" style="margin-bottom: 20px;">
            <label for="pass_confirm">Parolni tasdiqlang</label>
            <input id="pass_confirm" type="password" required data-auth-field="password_confirm" placeholder="••••••••••••">
            <div class="field-hint">Kamida 8 ta belgi</div>
            <div class="field-error" data-error-for="password_confirm" hidden></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Parolni saqlash</button>
        </form>

        <p style="text-align:center; margin-top:26px; font-size:14px; color:var(--ink-500);">
          Parolni esladingizmi? <a href="login.html" style="color:var(--violet-600); font-weight:700;">Kirish</a>
        </p>
      </div>
    </div>
  </div>
  <script src="../../js/api.js"></script>
<script src="../../js/escape.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/ui-feedback.js"></script>
  <script src="../../js/auth-guard.js"></script>
</body>

</html>
