<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parolni tiklash — Isloh</title>
  <link rel="stylesheet" href="../../css/vendor/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
  <div class="auth-split">
    <div class="auth-panel">
      <div>
        <div class="brand">
          <div class="brand-mark">I</div> Isloh
        </div>
        <div class="auth-tagline" style="margin-top:60px;">Aqlliroq o'rganing,<br>Uzoqroq emas.</div>
        <div class="auth-sub">Barcha kurslaringiz, bitta platformada.<br>Bitta AI murabbiy bilan.</div>
      </div>
      <div style="font-size:12px; color:#807CB0;">© 2026 Isloh. Barcha huquqlar himoyalangan.</div>
    </div>

    <div class="auth-form-side">
      <div class="auth-form-inner">
        <h2 style="font-size:26px;">Parolni tiklash 🔑</h2>
        <p style="color:var(--ink-500); font-size:14px; margin: 8px 0 28px;">Email manzilingizni kiriting va biz tiklash havolasini yuboramiz</p>

        <form novalidate onsubmit="event.preventDefault();">
          <div class="field-error" data-error-for="form" hidden></div>
          <div class="field" style="margin-bottom: 20px;">
            <label for="email">Email manzil</label>
            <input id="email" type="email" required data-auth-field="email" placeholder="email@gmail.com">
            <div class="field-error" data-error-for="email" hidden></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Tiklash havolasini yuborish</button>
        </form>

        <p style="text-align:center; margin-top:26px; font-size:14px; color:var(--ink-500);">
          Parolni esladingizmi? <a href="login.html" style="color:var(--violet-600); font-weight:700;">Kirish</a>
        </p>
      </div>
    </div>
  </div>
  <script src="../../js/api.js"></script>
  <script src="../../js/toast.js"></script>
  <script src="../../js/ui-feedback.js"></script>
  <script src="../../js/auth-guard.js"></script>
</body>

</html>
